[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamfly"
version = "1.0.0"
description = "A fruit fly's mushroom-body circuit that chooses trading strategies on DreamDEX, with a dashboard, dry-run and live spot orders."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "DreamDEX S.A." }]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "python-dotenv>=1.0",
    "websockets>=13",
]

[project.optional-dependencies]
# Real orders go through the DreamDEX bot kit's Python client, installed from an archive of the public repo
# pinned to a commit (no git needed). Bump the commit when the kit changes.
live = [
    "dreamdex-core @ https://github.com/somnia-chain/dreamdex-bot-kit/archive/9b8fd395de8d1578b46ebd40a231e659cfc2f966.zip#subdirectory=packages/core-py",
]
dev = ["pytest>=8"]

[project.scripts]
dreamfly = "flybot.cli:main"

[project.urls]
Repository = "https://github.com/somnia-chain/dreamdex-dreamfly"

[tool.setuptools.packages.find]
include = ["flybot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
